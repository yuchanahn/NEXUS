[package]
name = "nexus-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
anyhow = "1"
base64 = "0.22"
axum = "0.8"
fs2 = "0.4"
futures-util = "0.3"
jsonschema = { version = "0.29", default-features = false }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
tempfile = "3"
llm-contract = { path = "../llm-provider/crates/llm-contract" }
llm-provider = { path = "../llm-provider/crates/llm-provider" }
provider-client = { path = "../llm-provider/crates/provider-client" }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "nexus-agent"
path = "src/main.rs"
